[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paste-modern"
version = "1.4.0.post1"
description = "Focused maintained PASTE runtime for spatial transcriptomics registration"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  {name = "Max Land"},
  {name = "Raphael Lab"},
]
maintainers = [{name = "Chen Yang", email = "cafferychen777@tamu.edu"}]
dependencies = [
  "anndata>=0.10,<0.13",
  "numpy>=1.26,<3",
  "POT>=0.9.6,<0.10",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/cafferychen777/paste"
Repository = "https://github.com/cafferychen777/paste"
"Original project" = "https://github.com/raphael-group/paste"
Issues = "https://github.com/cafferychen777/paste/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["paste", "paste.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
